# An external backend. lifier runs the command as-is, so a machine across the
# network needs no code in lifier: the transport is part of the manifest.
#
# Install this as $XDG_CONFIG_HOME/lifier/providers/arrakis-docker.yaml, and
# lifier resolves `backend: arrakis` to it.
version: provider/v1
kind: sandbox
name: arrakis
description: Container sandbox on arrakis over SSH
command:
  - ssh
  - -o
  - BatchMode=yes
  - arrakis
  - lifier
  - backend
  - docker
requires:
  commands:
    - ssh
defaults:
  timeout: 10m
actions:
  sandbox:
    description: Create, start, exec, and destroy containers on arrakis
