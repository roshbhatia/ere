defaultBackend: docker
amp:
  apiKeySecret: env://AMP_API_KEY
defaults:
  mountPath: /workspace
  cpus: 2
  memoryMB: 4096
  diskGB: 30
providers:
  lima:
    vmType: auto
  kubernetes-pod:
    context: ere-local
    namespace: ere
    kubeconfig: ~/.kube/ere.yaml
  kubernetes-kubevirt:
    context: ere-local
    namespace: ere
    kubeconfig: ~/.kube/ere.yaml
    sshKey: ~/.ssh/ere
    sshUser: ere
runners:
  - name: docker-example
    backend: docker
    image: ere/amp:latest
    workspace: .
    runnerId: ere-docker-example
  - name: lima-example
    backend: lima
    image: template://_images/ubuntu-lts
    workspace: .
    runnerId: ere-lima-example
    provision: &install-amp
      - |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y curl ca-certificates git
        if ! test -x /opt/amp/bin/amp; then
          curl -fsSL https://ampcode.com/install.sh -o /tmp/install-amp.sh
          AMP_HOME=/opt/amp bash /tmp/install-amp.sh
          rm /tmp/install-amp.sh
        fi
        chmod 755 /opt/amp /opt/amp/bin /opt/amp/bin/amp
        if ! test /usr/local/bin/amp -ef /opt/amp/bin/amp; then
          ln -s /opt/amp/bin/amp /usr/local/bin/amp
        fi
    env: &amp-path
      PATH: /opt/amp/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  - name: pod-example
    backend: kubernetes-pod
    image: ghcr.io/your-org/amp:version
    runnerId: ere-pod-example
    storage:
      kind: pvc
      sizeGB: 10
  - name: kubevirt-example
    backend: kubernetes-kubevirt
    architecture: arm64
    bootVolume: amp-boot
    runnerId: ere-kubevirt-example
    storage:
      kind: pvc
      sizeGB: 10
    provision: *install-amp
    env: *amp-path
