providers:
  incus-lab:
    kind: incus
    remote: lab
    project: agents
    vmType: vm
amp:
  apiKeySecret: env://AMP_API_KEY
  remoteControlTerminal: true
runners:
  - name: incus-dev
    runnerId: ere-incus-dev
    backend: incus-lab
    image: images:ubuntu/24.04
    storage:
      kind: guest-disk
    provision:
      - |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y curl ca-certificates git
        installer=$(mktemp)
        trap 'rm -f "$installer"' EXIT
        curl -fsSL https://ampcode.com/install.sh -o "$installer"
        AMP_HOME=/opt/amp bash "$installer"
        chmod 755 /opt/amp /opt/amp/bin /opt/amp/bin/amp
        ln -sfn /opt/amp/bin/amp /usr/local/bin/amp
