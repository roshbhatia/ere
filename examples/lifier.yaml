# lifier configuration. Copy to $XDG_CONFIG_HOME/lifier/lifier.yaml.
defaultBackend: docker

amp:
  binary: amp
  # lifier never stores a credential. It resolves this reference at launch and
  # passes the value to the sandbox over stdin.
  apiKeySecret: "op://Personal/ampcode/credential"
  remoteControlTerminal: false

defaults:
  image: lifier/amp:latest
  mountPath: /workspace
  cpus: 4
  memoryMB: 8192
  diskGB: 60

runners:
  # A container on the local Docker daemon. Fast to create, shares the kernel.
  - name: sysinit
    backend: docker
    workspace: ~/src/sysinit
    runnerId: workstation-sysinit

  # A Linux VM on Apple's Virtualization.framework. Its own kernel, so an agent
  # that installs system packages cannot reach the host.
  - name: sysinit-vm
    backend: vz
    workspace: ~/src/sysinit
    runnerId: workstation-sysinit-vm
    provision:
      - "command -v amp || curl -fsSL https://ampcode.com/install.sh | bash"
    env:
      PATH: "/home/$USER.linux/.amp/bin:/usr/local/bin:/usr/bin:/bin"

  # The same VM shape on QEMU. On Linux this is KVM-accelerated.
  - name: sysinit-qemu
    backend: qemu
    workspace: ~/src/sysinit
    runnerId: workstation-sysinit-qemu
    secrets:
      OPENROUTER_API_KEY: "op://Personal/openrouter/api-key"
