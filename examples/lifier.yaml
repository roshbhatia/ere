defaultBackend: docker

amp:
  apiKeySecret: env://AMP_API_KEY

defaults:
  image: lifier/amp:latest
  mountPath: /workspace
  cpus: 2
  memoryMB: 4096
  diskGB: 30

runners:
  - name: docker-example
    backend: docker
    workspace: .
    runnerId: lifier-docker

  - name: lima-example
    backend: vz
    workspace: .
    runnerId: lifier-lima
    provision:
      - |
        if ! test -x /opt/amp/bin/amp; then
          curl -fsSL https://ampcode.com/install.sh -o /tmp/install-amp.sh &&
          sudo env AMP_HOME=/opt/amp bash /tmp/install-amp.sh
        fi
    env:
      PATH: /opt/amp/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

  - name: k8s-example
    backend: k8s
    workspace: .
    runnerId: lifier-k8s
    provision:
      - |
        if ! test -x /opt/amp/bin/amp; then
          curl -fsSL https://ampcode.com/install.sh -o /tmp/install-amp.sh &&
          sudo env AMP_HOME=/opt/amp bash /tmp/install-amp.sh
        fi
    env:
      PATH: /opt/amp/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
