version: "3"

vars:
  BIN: ere
  BIN_DIR: "{{.HOME}}/.local/bin"
  COVER_OUT: coverage.out
  IMAGE: ere/amp:latest

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  # ── Build ──────────────────────────────────────────────────────────────────

  build:
    desc: Build the ere binary to ./ere
    cmd: go build -ldflags="-s -w" -o {{.BIN}} ./cmd/ere
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN}}"

  install:
    desc: Install ere to $BIN_DIR (~/.local/bin by default)
    cmd: |
      mkdir -p {{.BIN_DIR}}
      GOBIN={{.BIN_DIR}} go install ./cmd/ere
      echo "installed to {{.BIN_DIR}}/ere"

  clean:
    desc: Remove build artifacts and coverage output
    cmd: rm -f {{.BIN}} {{.COVER_OUT}}

  image:build:
    desc: Build the default docker sandbox image
    cmd: docker build -t {{.IMAGE}} images/amp

  # ── Test ───────────────────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmd: go test ./...

  test:race:
    desc: Run all tests with race detector
    cmd: go test -race ./...

  test:cover:
    desc: Run tests with coverage and open the report
    cmds:
      - go test -race -coverprofile={{.COVER_OUT}} ./...
      - go tool cover -html={{.COVER_OUT}}

  # ── Lint / vet ─────────────────────────────────────────────────────────────

  lint:
    desc: Run go vet and staticcheck
    cmds:
      - go vet ./...
      - staticcheck ./...

  vet:
    desc: Run go vet only
    cmd: go vet ./...

  # ── Format ─────────────────────────────────────────────────────────────────

  fmt:
    desc: Format Go files with gofumpt
    cmd: gofumpt -w .

  fmt:check:
    desc: Check Go formatting without writing
    cmd: |
      unformatted=$(gofumpt -l .)
      if [ -n "$unformatted" ]; then
        echo "$unformatted" >&2
        exit 1
      fi

  fmt:sh:
    desc: Format shell scripts in hack/ with shfmt
    cmd: shfmt -i 2 -ci -sr -s -w hack/

  fmt:sh:check:
    desc: Check shell script formatting without writing
    cmd: shfmt -i 2 -ci -sr -s -d hack/

  fmt:nix:
    desc: Format Nix files
    cmd: nix fmt

  fmt:all:
    desc: Format Go, shell, and Nix files
    deps: [fmt, fmt:sh, fmt:nix]

  # ── Nix ────────────────────────────────────────────────────────────────────

  nix:check:
    desc: Validate the Nix flake
    cmd: nix flake check

  nix:build:
    desc: Build the Nix package (does not switch)
    cmd: nix build

  # ── Convenience ────────────────────────────────────────────────────────────

  check:
    desc: Full pre-commit check (vet, fmt check, tests with race)
    deps: [vet, fmt:check, fmt:sh:check]
    cmd: go test -race ./...

  plugin:test:
    desc: Test Amp allocation and remote submission behavior
    cmd: node --experimental-strip-types --test integrations/amp/plugin.test.mjs

  plugin:types:
    desc: Check plugin types against the installed Amp CLI
    cmd: hack/check-plugin-types.sh

  kubevirt:bootstrap:
    desc: Install pinned KubeVirt and CDI in an explicit test cluster
    cmd: hack/bootstrap-kubevirt.sh {{.CLI_ARGS}}

  runner:verify:
    desc: Verify runtime and stop/start retention for a dedicated verify- profile
    cmd: hack/verify-runner.sh {{.CLI_ARGS}}
